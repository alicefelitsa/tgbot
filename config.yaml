# ===========================
# Telegram 机器人配置
# ===========================
telegram:
  botToken: "8686069122:AAEnl21vArtsqlRvg-52T0c18y0iR5pdPtw"          # BotFather 拿的 token，待填
  webhookPath: "/api/tg/webhook"
  secretToken: "dev_placeholder_change_me_3f9a1c"          # 校验回调来源，防伪造（上线切 webhook 时换成随机长串，启动会自动以该值注册）
  publicBase: "https://www.bot-tg.cc"       # 注册 webhook 用的公网 HTTPS 域名（debugPolling=false 时启动会自动 SetWebhook(publicBase+webhookPath)）
  # 本地调试开关：true=用 getUpdates 长轮询(无需公网 HTTPS/域名，需能出站访问 api.telegram.org)
  # 上线走 webhook 时置 false：启动时自动注册 webhook(需 publicBase 为真实可被 Telegram 访问的 HTTPS 域名)。二者互斥，轮询模式启动会自动先 deleteWebhook。
  debugPolling: true
  # 图片库入库中转 chat：往这个 chat 发一张图、读回 Telegram 的 file_id 后再删除该消息，用于「图片库」换取可复用的 file_id。
  # 必须是 bot 能主动发消息的对象(例：你自己的 TG 私聊 chat_id)；换 bot 后 file_id 失效需重新入库。
  # 注：运行时以数据库「系统设置」的 imageRelayChatID 为准(后台改完即生效)，本行仅当库中无值时兜底。
  imageRelayChatID: 7569435732
  # 图片库预览的本地磁盘缓存目录:按 file_id 缓存从 Telegram 下载的原图字节,命中则不再重复拉取。留空则默认 ./data/imgcache。
  imageCacheDir: "data/imgcache"
