# ===========================
# 服务器端口配置
# ===========================
server:
  # Web服务端口
  webPort: 8200
  # 限流队列容量
  queueCapacity: 1000
  # 限流突发容量
  suddenCapacity: 2000
  # Bot 分发层按 chat_id 分片的并发数(同一会话恒定落同一分片保序,跨分片并行)。<=0 时代码默认 8。
  shardCount: 8
  # 首页横幅「接口取数」引导语的按会话缓存时长(秒):0=不缓存、每次 /start 都实时拉接口;>0 则同会话缓存该秒数;不配置此键则代码默认 30。
  bannerCacheSec: 0

# ===========================
# 安全策略
# ===========================
security:
  # 登录限流:每个客户端 IP 在窗口内最多尝试次数(防暴力猜密)。<=0 时代码默认 10。
  loginMaxAttempts: 10
  # 登录限流窗口时长(秒)。<=0 时代码默认 60。
  loginWindowSec: 60

